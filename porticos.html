const CAM_SVG = '<svg width="34" height="34" viewBox="0 0 24 24" class="camIcon"><path fill="#00e5ff" stroke="#012" stroke-width="0.7" d="M9 3l-1.7 2H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.3L15 3H9zm3 4.5a5.2 5.2 0 1 1 0 10.4 5.2 5.2 0 0 1 0-10.4zm0 2a3.2 3.2 0 1 0 0 6.4 3.2 3.2 0 0 0 0-6.4z"/></svg>';
const LPR_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" class="lprIcon"><circle cx="12" cy="12" r="9" fill="#ffd23f" stroke="#012" stroke-width="1"/></svg>';
const camIcon = L.divIcon({html:CAM_SVG, className:'', iconSize:[34,34], iconAnchor:[17,17]});
const lprIcon = L.divIcon({html:LPR_SVG, className:'', iconSize:[16,16], iconAnchor:[8,8]});

// mapa
const map=L.map('map',{zoomControl:true,attributionControl:true,zoomAnimation:false}).setView([-34.46,-58.91],11);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Imágenes © Esri'}).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,opacity:.8}).addTo(map);
const ring=PILAR.coordinates[0];
const outer=[[-60.6,-32.4],[-58.0,-32.4],[-58.0,-35.6],[-60.6,-35.6],[-60.6,-32.4]];
L.geoJSON({type:'Polygon',coordinates:[outer,ring]},{style:{stroke:false,fillColor:'#04070d',fillOpacity:.62,interactive:false}}).addTo(map);
L.geoJSON(LOCS,{style:f=>({color:f.properties.color,weight:2,opacity:.95,fillColor:f.properties.color,fillOpacity:.14,interactive:false})}).addTo(map);
L.geoJSON(PILAR,{style:{color:'#6fe3ff',weight:2.5,fill:false,opacity:.95,interactive:false}}).addTo(map);
LOCS.features.forEach(f=>{ L.marker([f.properties.cy,f.properties.cx],{opacity:0,interactive:false}).addTo(map).bindTooltip(f.properties.name.toUpperCase(),{permanent:true,direction:'center',className:'locLbl'}); });
const b=L.latLngBounds(DATA.map(r=>[r[3],r[2]]));
ring.forEach(c=>b.extend([c[1],c[0]]));
function frameMap(){ map.invalidateSize(); map.setView(b.getCenter(), map.getBoundsZoom(b,false,L.point(40,40)),{animate:false}); }
frameMap(); addEventListener('load',frameMap);

// DATA rows: [tipo("P"|"L"), name, lon, lat, corto, year, cams]
// agrupar por year
const byYear = {};
DATA.forEach(r=>{ const y=r[5]; if(!byYear[y]) byYear[y]=[]; byYear[y].push(r); });
const YEARS = Object.keys(byYear).map(x=>+x).sort((a,b)=>a-b);
// para cada year, calcular resumen (ahora r[6]=0 para porticos, 1 para lpr — cada L es 1 camara)
const STAGES = YEARS.map(y=>{
  const rs=byYear[y];
  const pCount=rs.filter(r=>r[0]==='P').length;
  const lCount=rs.filter(r=>r[0]==='L').length;
  const bits=[]; if(pCount) bits.push(`<b>${pCount} pórtico${pCount>1?'s':''}</b>`);
  if(lCount) bits.push(`<span class="lpr"><b>${lCount} LPR</b></span>`);
  const sub = "Se instalaron " + bits.join(' · ');
  return {year:y, rows:rs, pCount, lCount, sub, totalCam:pCount+lCount};
});

// stages panel
const st=document.getElementById('stages');
STAGES.forEach((s,i)=>{
  const parts=[]; if(s.pCount) parts.push('Pórt '+s.pCount); if(s.lCount) parts.push('LPR '+s.lCount);
  st.innerHTML += `<div class="row" id="st${i}"><span class="dot"></span><span class="yr">${s.year}</span><span>${parts.join(' · ')}</span><span class="cnt">${s.totalCam}</span></div>`;
});

let shownP=0, shownL=0, markers=[];
function addRow(r){
  const isP = r[0]==='P';
  const m=L.marker([r[3],r[2]],{icon: isP?camIcon:lprIcon}).addTo(map);
  const label = r[4];
  // los pines LPR solo muestran tooltip al hacer hover para no llenar el mapa
  if(isP){ m.bindTooltip(label,{permanent:true,direction:'right',offset:[10,0],className:'ptip'}); }
  else { m.bindTooltip(label,{permanent:false,direction:'top',className:'ltip'}); }
  markers.push(m);
  if(isP){ shownP++; document.getElementById('numP').textContent=shownP; }
  else   { shownL++; document.getElementById('numL').textContent=shownL; }
}
function clearAll(){ markers.forEach(m=>map.removeLayer(m)); markers=[]; shownP=0; shownL=0; document.getElementById('numP').textContent=0; document.getElementById('numL').textContent=0; document.querySelectorAll('#stages .row').forEach(r=>r.classList.remove('act','done')); }
function highlight(i,done=false){
  document.querySelectorAll('#stages .row').forEach(r=>r.classList.remove('act'));
  for(let k=0;k<i;k++){ const el=document.getElementById('st'+k); if(el) el.classList.add('done'); }
  if(!done){ const el=document.getElementById('st'+i); if(el) el.classList.add('act'); }
  else { const el=document.getElementById('st'+i); if(el){ el.classList.remove('act'); el.classList.add('done'); } }
}

const CARD_MS=2800;
const PER_MARK=110;
let running=true, timers=[];
function clearTimers(){ timers.forEach(t=>clearTimeout(t)); timers=[]; }
function showYearCard(st){
  return new Promise(res=>{
    document.getElementById('ycEtapa').textContent='AÑO';
    document.getElementById('ycYear').textContent=st.year;
    document.getElementById('ycSub').innerHTML=st.sub;
    const c=document.getElementById('yearCard'); c.classList.add('show');
    timers.push(setTimeout(()=>{ c.classList.remove('show'); timers.push(setTimeout(res,600)); }, CARD_MS));
  });
}
function sleep(ms){ return new Promise(r=>{ timers.push(setTimeout(r,ms)); }); }
async function runTimeline(){
  clearAll(); clearTimers(); running=true;
  document.getElementById('play').textContent='❚❚ Pausa';
  for(let i=0;i<STAGES.length;i++){
    if(!running) return;
    highlight(i);
    await showYearCard(STAGES[i]);
    if(!running) return;
    for(const r of STAGES[i].rows){
      if(!running) return;
      addRow(r);
      await sleep(PER_MARK);
    }
    highlight(i,true);
    await sleep(400);
  }
  document.getElementById('play').textContent='▶ Reproducir';
  running=false;
}
const playBtn=document.getElementById('play');
playBtn.onclick=()=>{
  if(!running && markers.length>=DATA.length){ runTimeline(); return; }
  if(running){ running=false; clearTimers(); document.getElementById('yearCard').classList.remove('show'); playBtn.textContent='▶ Reproducir'; }
  else { running=true; playBtn.textContent='❚❚ Pausa'; runTimeline(); }
};
document.getElementById('restart').onclick=()=>{ clearTimers(); document.getElementById('yearCard').classList.remove('show'); runTimeline(); };
document.getElementById('all').onclick=()=>{ clearTimers(); running=false; clearAll(); DATA.forEach(r=>addRow(r)); STAGES.forEach((_,i)=>highlight(i,true)); playBtn.textContent='▶ Reproducir'; document.getElementById('yearCard').classList.remove('show'); };

setTimeout(runTimeline, 400);
</script>
