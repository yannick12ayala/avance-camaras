  {name:'Fase 1 y 2', sub:'Base instalada (histórica)', color:'#FFD23F'},
  {name:'Fase 3',     sub:'Expansión 2024–2025',        color:'#34D399'},
  {name:'Fase 4',     sub:'Ampliación',                  color:'#FB923C'},
  {name:'Fase 5',     sub:'Vigente 2025–2026',           color:'#E879F9'}
];
let pts = PTS.filter(p=>p[1]<-34.2&&p[1]>-34.7&&p[0]<-58.6&&p[0]>-59.5);
pts.sort((a,b)=>a[2]-b[2]);
const N=pts.length, counts=[0,0,0,0]; pts.forEach(p=>counts[p[2]]++);
const CAMS=[1220,311,590,272];  // total oficial de camaras por fase (Fase 1y2 sin desglose = ubicaciones)
const camsPrefix=new Float64Array(N); let _ca=0; for(let i=0;i<N;i++){_ca+=CAMS[pts[i][2]]/counts[pts[i][2]];camsPrefix[i]=_ca;} const totalCams=CAMS.reduce((a,b)=>a+b,0);

// --- mapa satelital ---
const map=L.map('map',{zoomControl:true,attributionControl:true,preferCanvas:true}).setView([-34.46,-58.91],12);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Imágenes © Esri'}).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,opacity:.8}).addTo(map);
const b=L.latLngBounds(pts.map(p=>[p[1],p[0]]));
map.fitBounds(b,{padding:[70,70]});

// --- canvas overlay ---
const cv=document.getElementById('cv'), ctx=cv.getContext('2d'); let W,H;
function sizeCanvas(){ const s=map.getSize(),dpr=Math.min(devicePixelRatio||1,2); cv.width=s.x*dpr;cv.height=s.y*dpr;cv.style.width=s.x+'px';cv.style.height=s.y+'px';ctx.setTransform(dpr,0,0,dpr,0,0);W=s.x;H=s.y; }
sizeCanvas(); addEventListener('resize',()=>{sizeCanvas();paint();});
map.on('move zoom viewreset moveend zoomend',()=>paint());

// --- leyenda + barra ---
const leg=document.getElementById('legend');
leg.innerHTML='<div class="row" style="opacity:.55;font-size:11px"><span></span><span></span><span class="cnt">ubic · cám</span></div>';
PH.forEach((ph,i)=>leg.innerHTML+=`<div class="row" id="lg${i}"><span class="sw" style="background:${ph.color}"></span><span>${ph.name}</span><span class="cnt">${counts[i].toLocaleString('es-AR')} · ${CAMS[i].toLocaleString('es-AR')}</span></div>`);
const bar=document.getElementById('bar');
PH.forEach((ph,i)=>bar.innerHTML+=`<div class="seg" style="flex:${counts[i]||1};background:${hex(ph.color,.18)}"><div class="fill" id="fl${i}" style="background:${ph.color}"></div></div>`);
function hex(c,a){const n=parseInt(c.slice(1),16);return`rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}

// --- animacion ---
const DUR=26000; let speed=1, paused=false, revealed=0, elapsed=0, lastProg=0;
const appear=new Float64Array(N).fill(-1);
let last=performance.now(), raf;
function frame(now){
  if(!paused) elapsed+=Math.min(now-last,50)*speed;
  last=now;
  const prog=Math.min(elapsed/DUR,1); lastProg=prog;
  const target=Math.floor(prog*N);
  for(let i=revealed;i<target;i++) appear[i]=elapsed;
  revealed=target;
  paint();
  if(prog>=1){ finish(); return; }
  raf=requestAnimationFrame(frame);
}
function paint(){
  ctx.clearRect(0,0,W,H);
  for(let i=0;i<revealed;i++){
    const p=pts[i], cp=map.latLngToContainerPoint([p[1],p[0]]), col=PH[p[2]].color;
    if(cp.x<-20||cp.x>W+20||cp.y<-20||cp.y>H+20) continue;
    const age=elapsed-appear[i];
    ctx.beginPath();ctx.arc(cp.x,cp.y,3.1,0,7);ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=7;ctx.fill();
    ctx.shadowBlur=0;ctx.lineWidth=1;ctx.strokeStyle='rgba(0,0,0,.55)';ctx.stroke();
    if(age>=0&&age<650){ const k=age/650; ctx.beginPath();ctx.arc(cp.x,cp.y,3.1+k*13,0,7);ctx.strokeStyle=hex(col,(1-k)*.85);ctx.lineWidth=1.8;ctx.stroke(); }
  }
  ctx.shadowBlur=0;
  document.getElementById('num').textContent=revealed.toLocaleString('es-AR');
  document.getElementById('num2').textContent=Math.round(revealed>0?camsPrefix[revealed-1]:0).toLocaleString('es-AR');
  const cur=revealed>0?pts[Math.min(revealed,N)-1][2]:0, ph=PH[cur];
  const pdot=document.getElementById('pdot');pdot.style.color=ph.color;pdot.style.background=ph.color;
  document.getElementById('ptxt').textContent=ph.name;
  document.getElementById('psub').textContent=ph.sub;
  PH.forEach((_,i)=>document.getElementById('lg'+i).classList.toggle('act',i===cur));
  let acc=0; for(let i=0;i<4;i++){ const rin=Math.max(0,Math.min(counts[i],revealed-acc)); document.getElementById('fl'+i).style.width=(counts[i]?rin/counts[i]*100:0)+'%'; acc+=counts[i]; }
  document.getElementById('time').textContent=(elapsed/1000).toFixed(1)+'s / '+(DUR/1000)+'s · '+Math.round(lastProg*100)+'%';
}
function finish(){ document.getElementById('done').classList.add('show'); document.getElementById('donebig').textContent=N.toLocaleString('es-AR')+' ubicaciones · '+totalCams.toLocaleString('es-AR')+' cámaras'; document.getElementById('play').textContent='▶ Reproducir'; paused=true; }
const playBtn=document.getElementById('play');
playBtn.onclick=()=>{ if(elapsed>=DUR){restart();return;} paused=!paused; playBtn.textContent=paused?'▶ Reproducir':'❚❚ Pausa'; if(!paused){last=performance.now();raf=requestAnimationFrame(frame);} };
document.getElementById('restart').onclick=restart;
function restart(){ cancelAnimationFrame(raf); elapsed=0;revealed=0;appear.fill(-1);paused=false;document.getElementById('done').classList.remove('show');playBtn.textContent='❚❚ Pausa';last=performance.now();raf=requestAnimationFrame(frame); }
document.querySelectorAll('.spd button').forEach(x=>x.onclick=()=>{speed=parseFloat(x.dataset.s);document.querySelectorAll('.spd button').forEach(y=>y.classList.remove('on'));x.classList.add('on');});
raf=requestAnimationFrame(frame);
</script>
